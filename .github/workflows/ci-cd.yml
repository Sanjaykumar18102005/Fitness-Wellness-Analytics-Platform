name: FitPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # 1. CONTINUOUS INTEGRATION (CI): CODE QUALITY & AUTOMATED TEST SUITE
  unit-and-integration-tests:
    name: Run Unit & Integration Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: fitness_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: testuser
      DB_PASSWORD: testpassword
      DB_NAME: fitness_platform
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: fitness_wellness_ci_jwt_secret_key_2026
      ENCRYPTION_SECRET: fitness_wellness_default_secret_key_32chars!

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Execute Database Migrations
        run: npm run migrate

      - name: Seed Database Initial Data
        run: npm run seed

      - name: Run Jest Test Suite (Unit & Integration)
        run: npm test

  # 2. CONTINUOUS DELIVERY (CD): DOCKER CONTAINER BUILD & INTEGRATION CHECK
  docker-build-and-deploy-check:
    name: Docker Containerization & Delivery Verification
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Launch Stack via Docker Compose
        run: docker compose up --build -d

      - name: Verify Container Health & Status
        run: |
          sleep 10
          docker compose ps

      - name: Run Test Suite Inside Container Environment
        run: docker compose exec -T app npm test

      - name: Test Production API Health Check Endpoint
        run: |
          curl -f http://localhost:3000/api/health-check || exit 1

      - name: Teardown Docker Stack
        if: always()
        run: docker compose down -v
