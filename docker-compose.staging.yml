version: "3.8"

services:
  app-staging:
    image: ${DOCKER_REGISTRY:-fitnessplatform}/fitness-app:${DOCKER_IMAGE_TAG:-develop}
    container_name: fitness_app_staging
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db-staging
      - DB_PORT=5432
      - DB_USER=${DB_USER:-staging_user}
      - DB_PASSWORD=${DB_PASSWORD:-staging_password}
      - DB_NAME=${DB_NAME:-fitness_staging_db}
      - JWT_SECRET=${JWT_SECRET:-fitpulse_staging_jwt_secret_key_2026}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-fitpulse_staging_encryption_key_32c!}
    depends_on:
      db-staging:
        condition: service_healthy
    networks:
      - staging-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health-check || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-staging:
    image: postgres:16-alpine
    container_name: fitness_postgres_staging
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-staging_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staging_password}
      POSTGRES_DB: ${DB_NAME:-fitness_staging_db}
    ports:
      - "5432:5432"
    volumes:
      - db-staging-data:/var/lib/postgresql/data
    networks:
      - staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-staging_user} -d ${DB_NAME:-fitness_staging_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  staging-net:
    driver: bridge

volumes:
  db-staging-data:
    driver: local
