version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
      - cache
    networks:
      - fitness-net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: fitness_platform
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - fitness-net

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - fitness-net

networks:
  fitness-net:
    driver: bridge

volumes:
  db-data:
